# A guest with an emulated RDMA NIC, for testing xNVMe over NVMe/RDMA without
# RDMA hardware. The NIC is rocm-ernic, an AMD Pensando ionic emulated by a
# vfio-user server on the initiator; the image is nosi's ubuntu-2610-rocm,
# which carries the matching ionic driver and rdma-core.
#
# The server runs its nvmeof backend, which answers over the emulated RDMA
# transport as an NVMe controller, so this one guest and one server are all
# the test needs and nothing else has to be running.

# The SSH options are passed verbatim to paramiko; see https://www.paramiko.org/
[cijoe.transport.root]
username = "root"
password = "root"
hostname = "localhost"
port = 4200

# Operator account on nosi images; used by root_unlock.
[cijoe.transport.odus]
username = "odus"
password = "odus.321"
hostname = "localhost"
port = 4200

[os]
name = "ubuntu"
version = "stonking"

[build.compiler]
bin = "gcc"

[qemu]
img_bin = "qemu-img"
default_guest = "ubuntu_2610_rocm_amd64"
default_systemimage = "ubuntu-2610-rocm-x86_64"

[qemu.systems.x86_64]
bin = "qemu-system-x86_64"

# Used by: qemu.guest_start.py and qemu.guest_kill.py
[qemu.guests.ubuntu_2610_rocm_amd64]
path = "{{ local.env.HOME }}/guests/ubuntu-2610-rocm-amd64"
system_label = "x86_64"

# Keyword arguments: joined onto the form: "-cpu host -smp 4 -m 4" etc.
system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}

# Raw arguments: passed without modification to qemu-system-{arch}
system_args.raw = """\
-M q35 \
"""

# Managed arguments: expands into longer incantations
system_args.tcp_forward = {host = 4200, guest = 22}

# The host side of the NIC, built and started by xnvme_guest_start_nvme. 'sha'
# must be the rocm-ernic revision the guest image was built from (nosi's
# provision/steps/40-rocm-ernic.sh): a server and a guest driver from different
# revisions present as a wedged device rather than a version error. So 'sha'
# moves with the image digest in system_imaging.toml.
[rocm_ernic]
repository = "https://github.com/ROCm/rocm-ernic"
sha = "4880c3428efb8653ca9b9747f67820ecf251b3f8"
prefix = "{{ local.env.HOME }}/opt/rocm-ernic"
socket = "/tmp/vfio-user-rocm-ernic.sock"
backend = "nvmeof:size=1G,bs=4096,nqn=nvmet-test,ip=192.168.200.1,port=4420"
log_level = "info"

# Pinned where rocm-ernic's own CI pins it at that revision.
[rocm_ernic.libvfio_user]
repository = "https://github.com/nutanix/libvfio-user"
sha = "20e9803"

# The guest side of the transport, set up by the test workflow. The controller
# answers on .1 and the guest takes .11. Nothing on the emulated wire answers
# ARP for the controller, so the guest gets a static neighbour for it; any
# link-layer address works, since the emulator routes by queue pair.
[rocm_ernic.transport]
netdev = "rocm-ernic0"
guest_addr = "192.168.200.11/24"
traddr = "192.168.200.1"
trsvcid = "4420"
target_lladdr = "02:00:00:00:c0:01"

# =============================================================================
# Devices
# =============================================================================

# The namespace of the rocm-ernic NVMe-oF controller, over RDMA
[[devices]]
uri = "192.168.200.1:4420"
subnqn = "nvmet-test"
nsid = 1
labels = [ "dev", "fabrics", "rdma", "nvm" ]
driver_attachment = "none"

[hugetlbfs]
mount_point = "/mnt/huge"
nr_hugepages = "1024"
