[cijoe.targets.root.ssh]
username = "root"
password = "root"
hostname = "localhost"
port = 4200

[cijoe.targets.odus.ssh]
username = "odus"
password = "odus.321"
hostname = "localhost"
port = 4200

[os]
name = "ubuntu"
version = "stonking"

[build.compiler]
bin = "gcc"

[qemu]
img_bin = "qemu-img"
default_guest = "ubuntu_2610_gpu_amd64"
default_systemimage = "ubuntu-2610-rocm-x86_64"

[qemu.systems.x86_64]
bin = "qemu-system-x86_64"

[qemu.guests.ubuntu_2610_gpu_amd64]
path = "{{ local.env.HOME }}/guests/ubuntu-2610-gpu-amd64"
system_label = "x86_64"

system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}

system_args.raw = """\
-M q35 \
"""

system_args.tcp_forward = {host = 4200, guest = 22}

[[devices]]
uri = "0000:03:00.0"
nsid = 1
labels = [ "dev", "pcie", "hip", "nvm" ]
driver_attachment = "userspace"

# Namespace 2, from the rig separate-metadata
[[devices]]
uri = "0000:03:00.0"
nsid = 2
labels = [ "hip", "meta_sep" ]
driver_attachment = "userspace"

# The same controller on the kernel's driver, for io_uring_dmabuf; the guest's
# only NVMe controller, so its namespace is nvme0n1. Labelled dmabuf alone, so
# only the tests written for that backend pick it
[[devices]]
uri = "/dev/nvme0n1"
nsid = 1
labels = [ "dmabuf" ]
driver_attachment = "kernel"

[hugetlbfs]
mount_point = "/mnt/huge"
nr_hugepages = "1024"

[xnvme.build]
setup_args = "-Dhip_offload_arch=gfx1250"
