---
doc: |
  Test xNVMe over the NVMe RDMA transport on Linux (rocm-ernic NVMe target)

  The guest has an emulated RDMA NIC whose server is itself the NVMe target,
  started with the guest; see configs/ubuntu-2610-rocm.toml. This addresses the
  guest end of the transport, checks that the kernel initiator can discover the
  target, and then runs the tests labelled rdma against it.

steps:
- name: sysinfo
  uses: linux.sysinfo

- name: hugepages
  uses: linux_setup_hugepages

- name: rdma_transport
  run: |
    ip addr replace {{ config.rocm_ernic.transport.guest_addr }} dev {{ config.rocm_ernic.transport.netdev }}
    ip link set {{ config.rocm_ernic.transport.netdev }} up
    ip neigh replace {{ config.rocm_ernic.transport.traddr }} lladdr {{ config.rocm_ernic.transport.target_lladdr }} dev {{ config.rocm_ernic.transport.netdev }} nud permanent
    ibv_devinfo | grep -E 'hca_id|state'

# Fails here, rather than in xNVMe, when the transport itself is down
- name: rdma_target_probe
  run: |
    modprobe nvme-rdma
    nvme discover -t rdma -a {{ config.rocm_ernic.transport.traddr }} -s {{ config.rocm_ernic.transport.trsvcid }}

- name: test_transport_rdma
  uses: core.testrunner
  with:
    args: '-k "rdma" tests --timeout=1800 --timeout-method=thread'
    random_order: false
