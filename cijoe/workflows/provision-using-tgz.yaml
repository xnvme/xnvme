---
doc: |
  Provision a qemu guest with multiple NVMe controllers and namespaces

  The operating system is defined by the bootable system-image in the cijoe
  config-section qemu.guests.GUEST_NAME, specifically 
  init_using_bootimage.url
  init_using_bootimage.img

  On "local" the folder "/tmp/artifacts", must contain

  * xnvme-src.tar.gz
  * xnvme-py-sdist.tar.gz

  These will be transferred to the guest, and unpacked in "/tmp/xnvme_source",
  then built and installed.

steps:
- name: guest_kill
  uses: qemu.guest_kill
  with:
    guest_name: "{{ config.qemu.default_guest }}"

- name: stage_nosi_guest
  uses: system_imaging.diskimage_from_oras
  with:
    pattern: "{{ config.qemu.default_systemimage }}"

- name: guest_initialize
  uses: qemu.guest_initialize
  with:
    guest_name: "{{ config.qemu.default_guest }}"
    system_image_name: "{{ config.qemu.default_systemimage }}"

- name: guest_start
  uses: xnvme_guest_start_nvme
  with:
    guest_name: "{{ config.qemu.default_guest }}"

- name: root_unlock
  uses: root_unlock

- name: guest_check
  run: |
    hostname

- name: xnvme_source_sync
  uses: xnvme_source_from_tgz
  with:
    artifacts: '/tmp/artifacts'
    xnvme_source: '{{ config.xnvme.repository.sync.remote_path }}'

- name: xnvme_build_prep
  uses: xnvme_build_prep
  with:
    xnvme_source: '{{ config.xnvme.repository.sync.remote_path }}'

# Dependencies of the test-suite, as opposed to the build/run dependencies
# installed by xnvme_build_prep; the guard is for the FreeBSD guests this
# workflow also provisions. The filesystem-level qublk cases format with XFS.
- name: test_deps
  run: |
    if command -v apt-get > /dev/null; then apt-get -qy install xfsprogs; fi

# The FreeBSD guest image does not yet carry the hugepages tool the test-suite
# reserves contigmem with; pipx is among the build dependencies installed above.
# Drop this once the image has it, as the Linux guest images do.
- name: test_tools
  run: |
    if [ "$(uname -s)" = "FreeBSD" ]; then PIPX_HOME=/opt/pipx PIPX_BIN_DIR=/usr/local/bin pipx install --force hugepages==0.3.0 && hugepages --version; fi

- name: xnvme_build
  uses: xnvme_build
  with:
    xnvme_source: '{{ config.xnvme.repository.sync.remote_path }}'

- name: xnvme_install
  uses: xnvme_install
  with:
    xnvme_source: '{{ config.xnvme.repository.sync.remote_path }}'

- name: ldconfig
  run: ldconfig /usr/local/lib/ || true

# Reprobe nvme so /dev/nvmeN enumerates in PCI slot order; otherwise vfu_kvssd
# lands at the wrong index. Runs after xnvme_install for the xnvme tool.
- name: stabilize_nvme_naming
  run: |
    if [ "$(uname -s)" = "Linux" ]; then xnvme driver --be upcie --all --force && xnvme driver --be posix --all && udevadm settle; fi

- name: xnvme_bindings_py_install_tgz
  uses: xnvme_bindings_py_install_tgz
  with:
    xnvme_source: '{{ config.xnvme.repository.sync.remote_path }}'

- name: fio_prep
  uses: fio_prep
