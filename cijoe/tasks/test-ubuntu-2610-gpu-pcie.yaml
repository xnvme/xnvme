---
doc: |
  Test xNVMe's upcie-hip backend on Linux, with an emulated AMD GPU

  The guest boots the compute-node-emulated rig, an NVMe controller and a port
  for the rocjitsu GPU behind one PCIe switch. This plugs in the GPU, which
  the guest's amdgpu brings up, checks that the controller can move data in
  and out of VRAM through the kernel, and then runs the tests labelled hip
  against the controller, driven from user space with its buffers in VRAM,
  and those of io_uring_dmabuf, which does IO on VRAM through the kernel.
  Last, it runs the tests of dma-bufs of host memory that udmabuf exports, on
  upcie directly and through a homi server, and on io_uring_dmabuf.

steps:
- name: facts
  uses: core.facts_gather

- name: gpu_plug
  uses: systems_devenv.rig_device_plug
  with:
    device_name: gpu0

- name: gpu_up
  run: |
    for _ in $(seq 36); do test -e /dev/kfd && ls /dev/dri | grep -q renderD && break; sleep 5; done
    test -e /dev/kfd && ls /dev/dri | grep -q renderD || { dmesg | grep -i amdgpu | tail -40; false; }

- name: hugepages
  uses: linux_setup_hugepages

- name: vram_io_probe
  run: |
    lsblk -no NAME,SERIAL | grep {{ config.rig.devices.nvme0.serial }}
    rocjitsu-guest-check iouring-vram /dev/$(lsblk -dno NAME,SERIAL | awk '$2=="{{ config.rig.devices.nvme0.serial }}" && $1 ~ /n1$/ {print $1}')

- name: test_hip
  uses: core.testrunner
  with:
    args: '-k "hip" tests --timeout=1800 --timeout-method=thread'
    random_order: false

# Again as clients of a homi server; kvs, dual_be and qublk take no --homi-id
- name: test_hip_homi
  uses: core.testrunner
  with:
    args: '-k "hip and not (kvs or dual_be or qublk)" tests --homi-id 42 --timeout=1800 --timeout-method=thread'
    random_order: false

# io_uring_dmabuf on the controller's block device, with the IO buffers in VRAM
- name: test_dmabuf
  uses: core.testrunner
  with:
    args: 'tests/tools/test_xnvmeperf_dmabuf.py --timeout=1800 --timeout-method=thread'
    random_order: false

- name: test_dmabuf_inside
  uses: core.testrunner
  with:
    args: '-k io_uring tests/logic/test_xnvme_tests_dmabuf.py --timeout=1800 --timeout-method=thread'
    random_order: false

# The udmabuf tests skip without these, here and in the steps above, so a job
# whose image lacks them fails here
- name: udmabuf_devices
  run: |
    test -c /dev/udmabuf && test -c /dev/dmabuf_import

- name: test_dmabuf_upcie
  uses: core.testrunner
  with:
    args: '-k "(dmabuf or xfer) and upcie and not hip" tests --timeout=1800 --timeout-method=thread'
    random_order: false

- name: test_dmabuf_upcie_homi
  uses: core.testrunner
  with:
    args: '-k "(dmabuf or xfer) and upcie and not hip" tests --homi-id 42 --timeout=1800 --timeout-method=thread'
    random_order: false
