---
doc: |
  Test xNVMe over the NVMe RDMA transport on Linux (rocm-ernic NVMe target)

  The guest has an emulated RDMA NIC whose server is itself the NVMe target,
  started with the guest by the rdma-node-emulated rig. This addresses the
  guest end of the transport, checks that the kernel initiator can discover the
  target, sends a handful of commands and a few seconds of I/O through xNVMe,
  and then runs the tests labelled rdma against it.

steps:
- name: facts
  uses: core.facts_gather

- name: hugepages
  uses: linux_setup_hugepages

- name: rdma_transport
  run: |
    ip addr replace {{ config.rig.devices.nic0.transport.guest_addr }} dev {{ config.rig.devices.nic0.transport.netdev }}
    ip link set {{ config.rig.devices.nic0.transport.netdev }} up
    ip neigh replace {{ config.rig.devices.nic0.transport.traddr }} lladdr {{ config.rig.devices.nic0.transport.target_lladdr }} dev {{ config.rig.devices.nic0.transport.netdev }} nud permanent
    ibv_devinfo | grep -E 'hca_id|state'

- name: rdma_target_probe
  run: |
    modprobe nvme-rdma
    nvme discover -t rdma -a {{ config.rig.devices.nic0.transport.traddr }} -s {{ config.rig.devices.nic0.transport.trsvcid }}

- name: test_rdma_io
  run: |
    xnvme enum --uri {{ config.rig.devices.nic0.transport.traddr }}:{{ config.rig.devices.nic0.transport.trsvcid }}
    lblk idfy {{ config.rig.devices.nic0.transport.traddr }}:{{ config.rig.devices.nic0.transport.trsvcid }} --dev-nsid 1 --be spdk
    head -c 32768 /dev/urandom > /tmp/rdma_io.in
    lblk write {{ config.rig.devices.nic0.transport.traddr }}:{{ config.rig.devices.nic0.transport.trsvcid }} --dev-nsid 1 --be spdk --slba 0x0 --nlb 7 --data-input /tmp/rdma_io.in
    lblk read {{ config.rig.devices.nic0.transport.traddr }}:{{ config.rig.devices.nic0.transport.trsvcid }} --dev-nsid 1 --be spdk --slba 0x0 --nlb 7 --data-output /tmp/rdma_io.out
    cmp -n 32768 /tmp/rdma_io.in /tmp/rdma_io.out
    xnvmeperf run --iopattern randwrite --qdepth 16 --iosize 4096 --runtime 3 --cpumask 0x1 --be spdk {{ config.rig.devices.nic0.transport.traddr }}:{{ config.rig.devices.nic0.transport.trsvcid }}
    xnvmeperf run --iopattern randread --qdepth 16 --iosize 4096 --runtime 3 --cpumask 0x1 --be spdk {{ config.rig.devices.nic0.transport.traddr }}:{{ config.rig.devices.nic0.transport.trsvcid }}

- name: test_transport_rdma
  uses: core.testrunner
  with:
    args: '-k "rdma" tests --timeout=1800 --timeout-method=thread'
    random_order: false
