---
name: publish-release

# A push to main whose head commit is 'ver: bump to vX.Y.Z' tags main and
# releases, from the artifacts of the 'verify' run of the pull-request that was
# merged, so neither main nor the tag runs the verification again, and starts a
# 'docgen' run of 'verify' on the new tag for the documentation of the release.
# The pull-request opened every gate, as it ended on the bump, and the release
# requires that every gated job, the release checklist among them, and
# 'ci-result' passed in that run. The artifacts are used only when that
# pull-request's head has the tree main now has, which branch protection's
# up-to-date rule makes the case for a merge; otherwise the release fails. Any
# other push does nothing here.
on:
  push:
    branches: [main]

# Queued, never cancelled: a release cut off halfway could leave a tag without
# its release
concurrency:
  group: publish-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: "startsWith(github.event.head_commit.message, 'ver: bump to v')"
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
    - name: Grab source
      uses: actions/checkout@v6

    - name: Check the files carrying the version, and write the release notes
      run: |
        python3 toolbox/xnvme_release.py "$(git log -1 --format=%s)" > "$RUNNER_TEMP/notes.md"

    - name: List the jobs that must have passed
      id: jobs
      run: |
        {
          echo 'jobs<<EOF'
          echo 'verify.yml: ci-result'
          python3 toolbox/gha_gates.py jobs | sed 's/^/verify.yml: /'
          echo 'EOF'
        } | tee -a "$GITHUB_OUTPUT"

    - name: Find the 'verify' run of the merged pull-request on this tree
      id: check
      uses: refenv/gha-project-auto-release/check@v1
      with:
        version-file: meson.build
        version-pattern: "^\\s*version: '([^']+)',"
        changelog: ''
        workflows: verify.yml
        jobs: ${{ steps.jobs.outputs.jobs }}

    - name: Collect the release assets from the pull-request's run
      env:
        RUN: ${{ fromJSON(steps.check.outputs.runs || '{}')['verify.yml'] }}
        VERSION: ${{ steps.check.outputs.version }}
      run: |
        mkdir -p assets
        gh run download "$RUN" --repo "$REPO" --name xnvme-src-archive --dir src
        gh run download "$RUN" --repo "$REPO" --name xnvme-src-archive-with-subprojects --dir src-fat
        gh run download "$RUN" --repo "$REPO" --name xnvme-py-sdist --dir py
        cp src/xnvme-src.tar.gz "assets/xnvme-$VERSION.tar.gz"
        cp src-fat/xnvme-src.tar.gz "assets/xnvme-fat-$VERSION.tar.gz"
        cp py/xnvme-py-sdist.tar.gz "assets/xnvme-py-sdist-v$VERSION.tar.gz"
        (cd assets && for archive in xnvme-*.tar.gz; do sha256sum "$archive" > "$archive.sha256sum"; done)
        gh run download "$RUN" --repo "$REPO" --pattern '*-reports' --dir reports
        tar czf "assets/test-results-v$VERSION.tar.gz" reports
        ls -lh assets

    - name: Tag, create the release, and start the 'docgen' run on the tag
      uses: refenv/gha-project-auto-release/release@v1
      with:
        version: ${{ steps.check.outputs.version }}
        notes-file: ${{ runner.temp }}/notes.md
        title: 'Release Notes: {tag}'
        assets: assets/*
        dispatch: verify.yml job=docgen
