---
name: verify-packaging

# Package xNVMe as RPMs and DEBs: of a checkout, for a test box, and of the
# release's source archive, as a distribution would; called by 'verify'.
on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  #
  # Build the Debian packages from the source archive without subprojects that
  # the release ships, with the packaging on salsa.debian.org, then lint them
  #
  deb-dist:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event.inputs.job == 'all'
    container:
      image: debian:trixie

    steps:
    - name: Install what unpacking the archive and dpkg-buildpackage need
      run: |
        apt-get update -qq
        apt-get install -y -qq git make python3 dpkg-dev lintian

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive

    - name: Retrieve the Debian packaging
      run: git clone --depth 1 https://salsa.debian.org/safl/xnvme.git /tmp/debpkg

    - name: Install the packaging's Build-Depends, and nothing else
      run: apt-get build-dep -y -qq /tmp/debpkg

    - name: Build the packages
      run: make deb-dist DEB_PKG=/tmp/debpkg SRC_TGZ=${{ steps.source.outputs.src_tgz }}

    - name: Lint the packages
      run: lintian --fail-on error --tag-display-limit 0 builddir/debbuild/*.changes

    - name: Install the packages
      run: apt-get install -y ./builddir/debbuild/*_0*.deb

    - name: Run the installed tools
      run: |
        xnvme library-info
        xnvme info 1GB --be ramdisk

    - name: Upload the packages
      uses: actions/upload-artifact@v6.0.0
      with:
        name: packages-debian
        path: builddir/debbuild/*.deb
        if-no-files-found: error

  rpm-dev:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event.inputs.job == 'all'
    container:
      image: fedora:44

    steps:
    # git before checkout: 'make rpm-dev' archives HEAD, so it needs a clone
    - name: Install what the spec builds with, and rpm-build
      run: dnf install -y git make meson gcc python3 rpm-build

    - name: Grab source
      uses: actions/checkout@v6

    - name: Build the RPM
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        meson setup builddir -Dwith-spdk=disabled -Dwith-libvfn=disabled
        make rpm-dev

    - name: Install the RPM
      run: dnf install -y builddir/meson-dist/RPMS/x86_64/xnvme-*.rpm

    - name: Run the installed tools
      run: |
        xnvme library-info
        xnvme info 1GB --be ramdisk

  #
  # Package xNVMe as a distribution would, from the source archive without
  # subprojects that the release ships, with only the spec's BuildRequires
  #
  rpm-dist:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event.inputs.job == 'all'
    container:
      image: fedora:44

    steps:
    - name: Install what unpacking the archive and rpmbuild need
      run: dnf install -y tar gzip make python3 rpm-build dnf-plugins-core findutils

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive

    - name: Install the spec's BuildRequires, and nothing else
      run: |
        sed "s/@VERSION@/0/" toolbox/xnvme-dist.spec.in > /tmp/deps.spec
        dnf builddep -y /tmp/deps.spec

    - name: Build the RPMs
      run: make rpm-dist SRC_TGZ=${{ steps.source.outputs.src_tgz }}

    - name: Install the RPM
      run: dnf install -y $(find builddir/rpmbuild/RPMS -name 'xnvme-*.rpm')

    - name: Run the installed tools
      run: |
        xnvme library-info
        xnvme info 1GB --be ramdisk
