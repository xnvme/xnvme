---
name: verify

# Pull-requests run what it takes to get onto main, so main and its tags run
# nothing again: the 'publish' workflow deploys the docs and releases from the
# artifacts of the pull-request that was merged. A manual run on any branch
# runs the jobs its 'job' names, 'all' every one.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]
  # Weekly, so the benchmarks keep being exercised
  schedule:
  - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job'
        required: true
        default: all
        type: choice
        options:
        - all
        - verify
        - bench
        - docgen

# A newer push or label on a pull-request supersedes its running run
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.job || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  #
  # Classify a pull-request: when it changes nothing but the documentation, then
  # the jobs building and verifying the code are skipped, and only
  # 'docgen-shallow' and 'docgen-full' build the documentation, the latter so
  # that 'publish' has it to deploy. A changed .cmd file counts as code, since
  # only the guest of 'docgen-full' runs it. Manual and weekly runs are not
  # classified. When the classification fails, then the change does not count
  # as documentation-only, and everything runs.
  #
  changes-to-docs:
    runs-on: ubuntu-24.04
    outputs:
      docs_prose_only: ${{ steps.classify.outputs.docs_prose_only }}

    steps:
    - name: Grab source
      uses: actions/checkout@v6
      continue-on-error: true
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Classify the change
      id: classify
      continue-on-error: true
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        docs_prose_only=false
        : > changed.txt
        if [ "$EVENT" = "pull_request" ]; then
          git diff --name-only --no-renames "$PR_BASE...HEAD" > changed.txt || : > changed.txt
        fi
        cat changed.txt
        if [ -s changed.txt ] && ! grep -qvE '^(docs/|[^/]+\.md$)' changed.txt &&
          ! grep -qE '^docs/.*\.cmd$' changed.txt; then
          docs_prose_only=true
        fi
        echo "docs_prose_only=$docs_prose_only" | tee -a "$GITHUB_OUTPUT"

  #
  # Produce a source-archive (with and without subprojects)
  #
  # with-subprojects
  # 
  #   To provide an artifact consisting of xNVMe and dependent projects for
  #   CI to consume as well as users in environments with no network access, a
  #   one-stop shop
  #
  # without-subprojects
  # 
  #   Primarily for system-package maintainers, for these then the dependencies
  #   are solved via the package-manager and related packages that may or
  #   may not be available, and thus, no "bundled" dependencies. Also, for
  #   minimalistic users, that does not need the external deps of e.g. SPDK
  #   and libvfn. It does carry uPCIe, which is header-only, needed by every
  #   Linux build, and packaged by no distribution.
  #
  source-archive:
    needs: changes-to-docs
    runs-on: ubuntu-24.04
    container: ghcr.io/xnvme/xnvme-deps-alpine-latest:main
    strategy:
      matrix:
        variant: [with-subprojects, without-subprojects]
    steps:
    - name: Grab source
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Add repos to git-config safe.directory
      run: |
        git config --global --add safe.directory $(pwd)

    - name: Check repository...
      run: |
        ls -lha
        git status

    - name: Generate Source Archive
      run: |
        if [ "${{ matrix.variant }}" = "with-subprojects" ]; then
          make clean gen-src-archive-with-subprojects
        else
          make clean gen-src-archive
        fi

    - name: Rename to un-versioned xnvme-src.tar.gz
      run: |
        ver=$(python3 toolbox/xnvme_ver.py --path meson.build)
        mv builddir/meson-dist/xnvme-$ver.tar.gz builddir/meson-dist/xnvme-src.tar.gz
        mv builddir/meson-dist/xnvme-$ver.tar.gz.sha256sum builddir/meson-dist/xnvme-src.tar.gz.sha256sum

    - name: Upload source archive
      uses: actions/upload-artifact@v6.0.0
      with:
        name: xnvme-src-archive${{ matrix.variant == 'with-subprojects' && '-with-subprojects' || '' }}
        path: |
          builddir/meson-dist/xnvme-src.tar.gz.sha256sum
          builddir/meson-dist/xnvme-src.tar.gz
        if-no-files-found: error

  #
  # Check source-format using pre-commit
  #
  source-format-check:
    runs-on: ubuntu-24.04
    container: ghcr.io/xnvme/xnvme-devenv/host:v0.12.0

    steps:
    - name: Grab source
      uses: actions/checkout@v6

    - name: Add repos to git-config safe.directory
      run: |
        git config --global --add safe.directory $(pwd)

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Run pre-commit
      run: pre-commit run --all-files

    - name: Test the cijoe scripts, those not needing a target, and the toolbox
      run: |
        python3 -m venv /tmp/selftest
        /tmp/selftest/bin/pip install -q pytest ./cijoe
        /tmp/selftest/bin/pytest -q -p no:cacheprovider cijoe/tests/selftest toolbox/tests

    # The 'publish' workflow releases when the merged pull-request ends on the
    # version bump; checking it here fails the pull-request, not the release
    - name: Check the version bump, when the pull-request ends on one
      if: github.event_name == 'pull_request'
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        git fetch --quiet --depth 1 origin "$HEAD_SHA"
        subject=$(git log -1 --format=%s FETCH_HEAD)
        case "$subject" in
        "ver: bump to v"*)
          mkdir -p /tmp/head
          git archive FETCH_HEAD | tar -x -C /tmp/head
          python3 toolbox/xnvme_release.py "$subject" --root /tmp/head
          ;;
        *) echo "Not a version bump: $subject" ;;
        esac

  #
  # Build xNVMe Python packages
  #
  ffi-python:
    needs: [source-archive, changes-to-docs, docgen-shallow]
    runs-on: ubuntu-24.04
    container: ghcr.io/xnvme/xnvme-deps-debian-trixie:main
    strategy:
      fail-fast: false

    steps:
    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Python sdist-packages, system-package deps.
      run: |
        apt-get install -qy libclang-17-dev

    - name: Python sdist-packages, build bindings
      run: |
        pushd python/bindings
        make clean build
        popd

    - name: Python sdist-packages, find(...)
      run: |
        find python/ -name *tar.gz

    - name: Rename
      run: |
        mv python/bindings/dist/xnvme-*.*.*.tar.gz python/bindings/dist/xnvme-py-sdist.tar.gz

    - name: Python sdist-packages, upload bindings
      uses: actions/upload-artifact@v6.0.0
      with:
        name: xnvme-py-sdist
        path: |
          python/bindings/dist/xnvme-py-sdist.tar.gz
        if-no-files-found: error

  #
  ffi-rust:
    needs: [source-archive, changes-to-docs, docgen-shallow]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true'
    container:
      image: ghcr.io/xnvme/xnvme-deps-debian-trixie:main

    steps:
    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Install dependencies
      run: |
        apt-get update -qy
        apt-get install -qy curl libclang-17-dev

    - name: Build xNVMe
      run: make common

    - name: Install xNVMe
      run: make install

    - name: ldconfig
      run: ldconfig

    - name: Execute 'xnvme library-info'
      run: xnvme library-info

    - uses: dtolnay/rust-toolchain@stable

    - name: Rust, generate and build bindings
      run: cargo build --release --manifest-path rust/Cargo.toml

    - name: Rust, run example
      run: cargo run --manifest-path rust/Cargo.toml

  # Build and test xNVMe
  #
  #
  # The job-matrices, generated first, so the jobs using them are scheduled as
  # soon as what they need is built, rather than queued behind the jobs started
  # before them.
  #
  matrices:
    needs: [changes-to-docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event.inputs.job == 'all' || github.event_name
      == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'verify'))

    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      build_linux: ${{ steps.build_linux.outputs.build_linux }}

    env:
      # Each entry is expanded into one entry per 'test_*' step of the cijoe task it
      # runs, so that the test-steps of a task are verified as separate jobs.
      BASE_MATRIX: |
        - {os: 'freebsd', ver: '14', guest_dir: 'freebsd-14-amd64', transport: 'pcie'}
        #- {os: 'freebsd', ver: '15', guest_dir: 'freebsd-15-amd64', transport: 'pcie'}
        - {os: 'debian', ver: 'trixie-iommu_enabled', guest_dir: 'debian-trixie-amd64', transport: 'pcie'}
        - {os: 'debian', ver: 'trixie-iommu_disabled', guest_dir: 'debian-trixie-amd64', transport: 'pcie'}
        - {os: 'debian', ver: 'trixie-iommu_enabled', guest_dir: 'debian-trixie-amd64', transport: 'tcp-spdk'}
        - {os: 'debian', ver: 'trixie-iommu_enabled', guest_dir: 'debian-trixie-amd64', transport: 'tcp-linux'}
      BUILD_LINUX: |
        # Using an alpine container which is the same as upstream but with bash
        # alpine: SPDK not supported, --with-spdk=disabled
        - {os: 'alpine', dh: 'refenv/alpine-bash', ver: 'latest'}
        - {os: 'archlinux', dh: 'archlinux', ver: 'latest'}
        - {os: 'centos', dh: 'quay.io/centos/centos', ver: 'stream9'}
        - {os: 'centos', dh: 'quay.io/centos/centos', ver: 'stream10'}
        - {os: 'debian', dh: 'debian', ver: 'bookworm'}
        - {os: 'debian', dh: 'debian', ver: 'forky'}
        - {os: 'debian', dh: 'debian', ver: 'trixie'}
        - {os: 'fedora', dh: 'fedora', ver: '42'}
        - {os: 'fedora', dh: 'fedora', ver: '43'}
        - {os: 'gentoo', dh: 'gentoo/stage3', ver: 'latest'}
        - {os: 'opensuse-tumbleweed', dh: 'opensuse/tumbleweed', ver: 'latest'}
        - {os: 'oraclelinux', dh: 'oraclelinux', ver: '9'}
        - {os: 'oraclelinux', dh: 'oraclelinux', ver: '10'}
        - {os: 'rockylinux', dh: 'rockylinux/rockylinux', ver: '9.7'}
        - {os: 'ubuntu', dh: 'ubuntu', ver: 'noble'}
        - {os: 'ubuntu', dh: 'ubuntu', ver: 'questing'}
        - {os: 'ubuntu', dh: 'ubuntu', ver: 'resolute'}

    steps:
    - uses: actions/checkout@v6

    - name: Generate the job-matrix from the cijoe tasks
      id: generate
      run: |
        pip install --quiet pyyaml
        python3 toolbox/gha_matrix.py <<< "$BASE_MATRIX" >> "$GITHUB_OUTPUT"

    - name: Show the generated job-matrix
      run: |
        echo '${{ steps.generate.outputs.matrix }}' | python3 -m json.tool

    - name: Generate the job-matrix of the Linux builds
      id: build_linux
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, yaml
        print("build_linux=" + json.dumps(yaml.safe_load(os.environ["BUILD_LINUX"])))
        PY

  #
  # Build the documentation without a guest, so without running the commands.
  # It is quick, and runs alongside source-archive; the jobs building and verifying
  # the code after it wait for it, so a change that breaks the documentation
  # schedules none of them.
  #
  docgen-shallow:
    runs-on: ubuntu-24.04

    steps:
    - name: Grab source
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Install doc toolchain
      run: |
        sudo apt-get -qy update
        sudo apt-get -qy install doxygen graphviz universal-ctags
        pipx install ./docs/tooling

    - name: Build the documentation
      run: make docs

  #
  # The jobs below run in the workflows they call, one file per kind of job;
  # they share this run, so they use its artifacts and 'ci-result' checks them.
  #
  docgen-full:
    needs: [changes-to-docs, source-archive, source-format-check, ffi-python]
    if: github.event.inputs.job == 'all' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.job == 'docgen')
    uses: ./.github/workflows/docgen-full.yml
    secrets: inherit

  build:
    needs: [changes-to-docs, source-archive, source-format-check, ffi-python, docgen-shallow, matrices]
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true'
    uses: ./.github/workflows/build.yml
    with:
      build_linux: ${{ needs.matrices.outputs.build_linux }}

  perf:
    needs: [changes-to-docs, source-archive, source-format-check, ffi-python]
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'schedule' || (github.event_name
      == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench')) || (github.event_name == 'workflow_dispatch'
      && (github.event.inputs.job == 'bench' || github.event.inputs.job == 'all')))
    uses: ./.github/workflows/perf.yml

  verify-makefile:
    needs: [changes-to-docs, source-archive, docgen-shallow]
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true'
    uses: ./.github/workflows/verify-makefile.yml

  verify-nvme-pcie-emulated:
    needs: [matrices, source-archive, source-format-check, ffi-python]
    if: github.event.inputs.job == 'all' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.job == 'verify')
    uses: ./.github/workflows/verify-nvme-pcie-emulated.yml
    with:
      matrix: ${{ needs.matrices.outputs.matrix }}

  verify-nvme-pcie-hardware:
    needs: [changes-to-docs, source-archive, source-format-check, ffi-python]
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event.inputs.job == 'all' || (github.event_name
      == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'maas')) || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.job == 'verify'))
    uses: ./.github/workflows/verify-nvme-pcie-hardware.yml

  verify-packaging:
    needs: [changes-to-docs, source-archive, source-format-check, ffi-python, docgen-shallow]
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true'
    uses: ./.github/workflows/verify-packaging.yml

  #
  # The one check that branch protection requires. It fails when any job failed or
  # was cancelled. A pull-request changing code must also have run the 'maas'
  # verification, which needs the 'maas' label; a documentation-only one needs the
  # docs to build.
  #
  ci-result:
    needs: [changes-to-docs, source-archive, source-format-check, ffi-python, ffi-rust, matrices, docgen-shallow, build, verify-makefile,
      verify-nvme-pcie-emulated, verify-nvme-pcie-hardware, verify-packaging, docgen-full]
    runs-on: ubuntu-24.04
    if: always()

    steps:
    - name: Check the results of the jobs
      env:
        RESULTS: ${{ toJSON(needs) }}
        EVENT: ${{ github.event_name }}
        DOCS_PROSE_ONLY: ${{ needs.changes-to-docs.outputs.docs_prose_only }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
        bad=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(" ")' \
          <<< "$RESULTS")
        if [ -n "$bad" ]; then
          echo "::error::Did not succeed: $bad"
          exit 1
        fi
        required="source-format-check docgen-shallow"
        if [ "$EVENT" = "pull_request" ] && [ "$DOCS_PROSE_ONLY" != "true" ]; then
          required="$required verify-nvme-pcie-hardware"
        fi
        for job in $required; do
          result=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTS")
          if [ "$result" != "success" ]; then
            case "$job" in
            verify-nvme-pcie-hardware) echo "::error::$job is required and was $result; a change to code needs the 'maas' label" ;;
            *) echo "::error::$job is required and was $result" ;;
            esac
            exit 1
          fi
        done
