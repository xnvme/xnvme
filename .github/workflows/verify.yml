---
name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]
  # Weekly, so the benchmarks keep being exercised
  schedule:
  - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job'
        required: true
        default: docgen
        type: choice
        options:
        - verify
        - bench
        - docgen

defaults:
  run:
    shell: bash

jobs:
  #
  # Classify a pull-request, or a push to main: when it changes nothing but the
  # documentation, then the jobs building and verifying the code are skipped, and
  # only 'docs' builds the documentation. A push to main still runs 'docgen', and
  # what it needs, since the site is built from the command outputs of its guest.
  # A changed .cmd file counts as code, since only the guest of 'docgen' runs it.
  # Tags and manual runs are not classified. When the classification fails, then
  # the change does not count as documentation-only, and everything runs.
  #
  changes-to-docs:
    runs-on: ubuntu-24.04
    outputs:
      docs_prose_only: ${{ steps.classify.outputs.docs_prose_only }}

    steps:
    - name: Grab source
      uses: actions/checkout@v6
      continue-on-error: true
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Classify the change
      id: classify
      continue-on-error: true
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        docs_prose_only=false
        : > changed.txt
        if [ "$EVENT" = "pull_request" ]; then
          git diff --name-only --no-renames "$PR_BASE...HEAD" > changed.txt || : > changed.txt
        elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] &&
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          git diff --name-only --no-renames "$BEFORE" HEAD > changed.txt || : > changed.txt
        fi
        cat changed.txt
        if [ -s changed.txt ] && ! grep -qvE '^(docs/|[^/]+\.md$)' changed.txt &&
          ! grep -qE '^docs/.*\.cmd$' changed.txt; then
          docs_prose_only=true
        fi
        echo "docs_prose_only=$docs_prose_only" | tee -a "$GITHUB_OUTPUT"

  #
  # Produce a source-archive (with and without subprojects)
  #
  # with-subprojects
  # 
  #   To provide an artifact consisting of xNVMe and dependent projects for
  #   CI to consume as well as users in environments with no network access, a
  #   one-stop shop
  #
  # without-subprojects
  # 
  #   Primarily for system-package maintainers, for these then the dependencies
  #   are solved via the package-manager and related packages that may or
  #   may not be available, and thus, no "bundled" dependencies. Also, for
  #   minimalistic users, that does not need the external deps of e.g. SPDK
  #   and libvfn.
  #
  source-archive:
    needs: changes-to-docs
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' || github.event_name == 'push'
    container: ghcr.io/xnvme/xnvme-deps-alpine-latest:main
    strategy:
      matrix:
        variant: [with-subprojects, without-subprojects]
    steps:
    - name: Grab source
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Add repos to git-config safe.directory
      run: |
        git config --global --add safe.directory $(pwd)

    - name: Check repository...
      run: |
        ls -lha
        git status

    - name: Generate Source Archive
      run: |
        if [ "${{ matrix.variant }}" = "with-subprojects" ]; then
          make clean gen-src-archive-with-subprojects
        else
          make clean gen-src-archive
        fi

    - name: Rename to un-versioned xnvme-src.tar.gz
      run: |
        mv builddir/meson-dist/xnvme-0.7.5.tar.gz builddir/meson-dist/xnvme-src.tar.gz
        mv builddir/meson-dist/xnvme-0.7.5.tar.gz.sha256sum builddir/meson-dist/xnvme-src.tar.gz.sha256sum

    - name: Upload source archive
      uses: actions/upload-artifact@v6.0.0
      with:
        name: xnvme-src-archive${{ matrix.variant == 'with-subprojects' && '-with-subprojects' || '' }}
        path: |
          builddir/meson-dist/xnvme-src.tar.gz.sha256sum
          builddir/meson-dist/xnvme-src.tar.gz
        if-no-files-found: error

  #
  # Check source-format using pre-commit
  #
  source-format-check:
    runs-on: ubuntu-24.04
    container: ghcr.io/xnvme/xnvme-devenv/host:v0.12.0

    steps:
    - name: Grab source
      uses: actions/checkout@v6

    - name: Add repos to git-config safe.directory
      run: |
        git config --global --add safe.directory $(pwd)

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Run pre-commit
      run: pre-commit run --all-files

  #
  # Ensure that bash completions, man pages, and the systemd unit are
  # generated without error
  #
  test-gen-targets:
    needs: [source-archive, changes-to-docs, docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true'
    container: ghcr.io/xnvme/xnvme-devenv/host:v0.12.0

    steps:
    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Install the build dependencies this tree names for the container's Ubuntu
      run: bash toolbox/pkgs/ubuntu-resolute.sh

    - name: Build xNVMe
      run: make common

    - name: Install xNVMe
      run: make install

    - name: ldconfig
      run: ldconfig

    - name: Execute 'xnvme library-info'
      run: xnvme library-info

    - name: Run make gen-bash-completions
      run: make gen-bash-completions

    - name: Run make gen-man-pages
      run: make gen-man-pages

    # The unit directory is given rather than discovered, so the check does not
    # depend on systemd being present in the container
    - name: Check the systemd unit substitutes and can be turned off
      run: |
        meson setup /tmp/bd-systemd --prefix=/opt/xnvme \
          -Dsystemd_unitdir=/lib/systemd/system -Dbuild_subprojects=false
        unit="/tmp/bd-systemd/toolbox/systemd/xnvme-homi@.service"
        grep -q '^ExecStart=/opt/xnvme/bin/homi ' "$unit"
        grep -q '^EnvironmentFile=/opt/xnvme/etc/xnvme/' "$unit"
        ! grep -qE '@[a-z_]+@' "$unit"
        unit="/tmp/bd-systemd/toolbox/systemd/xnvme-qublk@.service"
        grep -q '^ExecStart=/opt/xnvme/bin/qublk serve ' "$unit"
        grep -q '^EnvironmentFile=/opt/xnvme/etc/xnvme/' "$unit"
        ! grep -qE '@[a-z_]+@' "$unit"
        meson introspect /tmp/bd-systemd --installed \
          | grep -q '/lib/systemd/system/xnvme-homi@.service'
        meson introspect /tmp/bd-systemd --installed \
          | grep -q '/lib/systemd/system/xnvme-qublk@.service'
        meson setup /tmp/bd-nosystemd -Dsystemd=disabled \
          -Dsystemd_unitdir=/lib/systemd/system -Dbuild_subprojects=false
        ! meson introspect /tmp/bd-nosystemd --installed \
          | grep -q 'xnvme-homi@.service'
        ! meson introspect /tmp/bd-nosystemd --installed \
          | grep -q 'xnvme-qublk@.service'

  build-rust:
    needs: [source-archive, changes-to-docs, docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true'
    container:
      image: ghcr.io/xnvme/xnvme-deps-debian-trixie:main

    steps:
    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Install dependencies
      run: |
        apt-get update -qy
        apt-get install -qy curl libclang-17-dev

    - name: Build xNVMe
      run: make common

    - name: Install xNVMe
      run: make install

    - name: ldconfig
      run: ldconfig

    - name: Execute 'xnvme library-info'
      run: xnvme library-info

    - uses: dtolnay/rust-toolchain@stable

    - name: Rust, generate and build bindings
      run: cargo build --release --manifest-path rust/Cargo.toml

    - name: Rust, run example
      run: cargo run --manifest-path rust/Cargo.toml

  #
  # Build xNVMe Python packages
  #
  build-python:
    needs: [source-archive, changes-to-docs, docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' || github.event_name == 'push'
    container: ghcr.io/xnvme/xnvme-deps-debian-trixie:main
    strategy:
      fail-fast: false

    steps:
    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Python sdist-packages, system-package deps.
      run: |
        apt-get install -qy libclang-17-dev

    - name: Python sdist-packages, build bindings
      run: |
        pushd python/bindings
        make clean build
        popd

    - name: Python sdist-packages, find(...)
      run: |
        find python/ -name *tar.gz

    - name: Rename
      run: |
        mv python/bindings/dist/xnvme-*.*.*.tar.gz python/bindings/dist/xnvme-py-sdist.tar.gz

    - name: Python sdist-packages, upload bindings
      uses: actions/upload-artifact@v6.0.0
      with:
        name: xnvme-py-sdist
        path: |
          python/bindings/dist/xnvme-py-sdist.tar.gz
        if-no-files-found: error

  #
  # Build on Linux using different Linux distributions
  #
  build-linux:
    needs: [source-archive, source-format-check, build-python, changes-to-docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')

    strategy:
      fail-fast: false
      matrix:
        include:
        # Using an alpine container which is the same as upstream but with bash
        # alpine: SPDK not supported, --with-spdk=disabled
        - {os: 'alpine', dh: 'refenv/alpine-bash', ver: 'latest'}
        - {os: 'archlinux', dh: 'archlinux', ver: 'latest'}
        - {os: 'centos', dh: 'quay.io/centos/centos', ver: 'stream9'}
        - {os: 'centos', dh: 'quay.io/centos/centos', ver: 'stream10'}
        - {os: 'debian', dh: 'debian', ver: 'bookworm'}
        - {os: 'debian', dh: 'debian', ver: 'forky'}
        - {os: 'debian', dh: 'debian', ver: 'trixie'}
        - {os: 'fedora', dh: 'fedora', ver: '42'}
        - {os: 'fedora', dh: 'fedora', ver: '43'}
        - {os: 'gentoo', dh: 'gentoo/stage3', ver: 'latest'}
        - {os: 'opensuse-tumbleweed', dh: 'opensuse/tumbleweed', ver: 'latest'}
        - {os: 'oraclelinux', dh: 'oraclelinux', ver: '9'}
        - {os: 'oraclelinux', dh: 'oraclelinux', ver: '10'}
        - {os: 'rockylinux', dh: 'rockylinux/rockylinux', ver: '9.7'}
        - {os: 'ubuntu', dh: 'ubuntu', ver: 'noble'}
        - {os: 'ubuntu', dh: 'ubuntu', ver: 'questing'}
        - {os: 'ubuntu', dh: 'ubuntu', ver: 'resolute'}

    container:
      image: ghcr.io/xnvme/xnvme-deps-${{ matrix.os }}-${{ matrix.ver }}:main

    steps:
    - name: Container-preparation, openSUSE does not have tar and gzip...
      if: contains(matrix.os, 'opensuse')
      run: zypper --non-interactive --no-refresh install -y tar gzip

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Configure with and build with debug enabled (without spdk)
      if: ${{ contains(matrix.os, 'alpine') }}
      run: |
        meson setup builddir --buildtype=debug -Dwith-spdk=disabled
        meson compile -C builddir
        make clean # prepare for building without debug

    - name: Configure with debug enabled
      if: ${{ ! contains(matrix.os, 'alpine') }}
      run: |
        meson setup builddir --buildtype=debug
        meson compile -C builddir
        make clean # prepare for building without debug

    - name: Configure, Build, and Install
      env:
        BSCRIPT_DEF: toolbox/pkgs/default-build.sh
        BSCRIPT: toolbox/pkgs/${{ matrix.os }}-${{ matrix.ver }}-build.sh
      run: |
        if [[ -f "${BSCRIPT}" ]]; then source ${BSCRIPT}; else source ${BSCRIPT_DEF}; fi

    - name: Execute 'ldconfig'
      # ldconfig doesn't work on alpine
      # centos7 needs "ldconfig /usr/lib/local" for python3 to work
      if: ${{!contains(matrix.os, 'alpine') && !contains(matrix.ver, 'centos7') && !contains(matrix.ver, 'stream8')}}
      run: ldconfig

    - name: meson-log-dump
      if: always()
      run: |
        cat builddir/meson-logs/meson-log.txt || true

    - name: isal-log-dump
      if: always()
      run: |
        cat subprojects/spdk/isa-l/spdk-isal.log || true

    - name: Execute 'xnvme enum'
      run: xnvme enum

    - name: Execute 'xnvme library-info'
      run: xnvme library-info

    - name: Execute the meson test-suite against the ramdisk
      # The enum cases enumerate the devices of the host; they are the only
      # cases needing hardware and privileges, so they are left out
      run: meson test -C builddir --print-errorlogs --no-suite enum

    - name: Check pkg-config
      run: |
        pkg-config xnvme --libs
        pkg-config xnvme --variable=datadir
        pkg-config xnvme --variable=includedir
        pkg-config xnvme --variable=libdir
        pkg-config xnvme --variable=pcfiledir
        pkg-config xnvme --variable=prefix
        ls -lh $(pkg-config xnvme --variable=libdir) | grep xnvme

    - name: Check Python, pip, pipx, platform, sysconfig and setup PATH for pipx
      run: |
        python3 --version
        python3 -m pip --version
        python3 -c 'import setuptools; print("setuptools version:", setuptools.__version__)'
        python3 -c "import platform; print(platform.system()); print(platform.uname())"
        python3 -c 'import sysconfig; print(sysconfig.get_config_var("SHLIB_SUFFIX"))'
        python3 -m pipx --version
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    # Setup Python virtual-environment for cijoe and Python xNVMe bindings to run ramdisk testing
    - name: CIJOE, setup pipx environment
      if: (!contains('focal', matrix.ver))
      run: |
        # cijoe requires Python >= 3.10; on RHEL9-family the default is 3.9,
        # so grab python3.11 from AppStream and steer pipx at it.
        if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3,10) else 1)'; then
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y python3.11 python3.11-pip
            export PIPX_DEFAULT_PYTHON=/usr/bin/python3.11
            echo "PIPX_DEFAULT_PYTHON=/usr/bin/python3.11" >> "$GITHUB_ENV"
          fi
        fi
        make cijoe-install

    - name: CIJOE, check that it is available
      if: (!contains('focal', matrix.ver))
      run: |
        cijoe -r

    - name: Python-bindings (ctypes), install and test
      if: (!contains('focal', matrix.ver))
      run: |
        python3 -m pipx inject xnvme-cijoe "${{ steps.source.outputs.directory }}/xnvme-py-sdist.tar.gz" --force
        pytest --pyargs xnvme.ctypes_bindings

    #
    # Ramdisk testing
    #
    # Skipping on distros with too old gcc/clang to build fio, and too old a Python to run cijoe (requires 3.9)
    #
    - name: CIJOE, run ramdisk verification
      if: (!contains('focal', matrix.ver))
      run: make verify-ramdisk CIJOE_OUTPUT="${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}"

    - name: CIJOE, upload report.html
      if: always() && (!contains('focal', matrix.ver))
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive build-${{ matrix.os }}-${{ matrix.ver }}-reports
      if: always() && (!contains('focal', matrix.ver))
      run: |
        tar czf ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-*

    - name: CIJOE, upload build-${{ matrix.os }}-${{ matrix.ver }}-reports
      if: always() && (!contains('focal', matrix.ver))
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports
        path: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports.tar.gz
        if-no-files-found: error

  #
  # Build on macOS
  #
  build-rpm:
    needs: [source-format-check, changes-to-docs, docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    container:
      image: fedora:44

    steps:
    # git before checkout: 'make build-rpm' archives HEAD, so it needs a clone
    - name: Install what the spec builds with, and rpm-build
      run: dnf install -y git make meson gcc python3 rpm-build

    - name: Grab source
      uses: actions/checkout@v6

    - name: Build the RPM
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        meson setup builddir -Dwith-spdk=disabled -Dwith-libvfn=disabled
        make build-rpm

    - name: Install the RPM
      run: dnf install -y builddir/meson-dist/RPMS/x86_64/xnvme-*.rpm

    - name: Run the installed tools
      run: |
        xnvme library-info
        xnvme info 1GB --be ramdisk

  build-macos:
    needs: [source-archive, source-format-check, build-python, changes-to-docs]
    runs-on: ${{ matrix.os }}-${{ matrix.ver }}
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: 'macos', ver: '15'}
        - {os: 'macos', ver: '26'}

    steps:
    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Install build-requirements
      run: |
        source toolbox/pkgs/${{ matrix.os }}-${{ matrix.ver }}.sh || true

    - name: Prep, environment GITHUB_PATH
      run: |
        echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH

    - name: Configure and build with debug enabled
      run: |
        meson setup builddir --buildtype=debug
        meson compile -C builddir
        make clean # prepare for building without debug

    - name: Configure, Build, and Install
      env:
        BSCRIPT_DEF: toolbox/pkgs/default-build.sh
        BSCRIPT: toolbox/pkgs/${{ matrix.os }}-${{ matrix.ver }}-build.sh
      run: |
        if [[ -f "${BSCRIPT}" ]]; then source ${BSCRIPT}; else source ${BSCRIPT_DEF}; fi

    - name: meson-log-dump
      if: always()
      run: |
        cat builddir/meson-logs/meson-log.txt || true

    - name: Execute 'xnvme enum'
      run: xnvme enum

    - name: Execute 'xnvme library-info'
      run: xnvme library-info

    - name: Check pkg-config
      run: |
        pkg-config xnvme --libs
        pkg-config xnvme --variable=datadir
        pkg-config xnvme --variable=includedir
        pkg-config xnvme --variable=libdir
        pkg-config xnvme --variable=pcfiledir
        pkg-config xnvme --variable=prefix
        ls -lh $(pkg-config xnvme --variable=libdir) | grep xnvme

    - name: Check Python, pip, platform, and sysconfig
      run: |
        python3 --version
        python3 -m pip --version
        python3 -c "import platform; print(platform.system()); print(platform.uname())"
        python3 -c 'import sysconfig; print(sysconfig.get_config_var("SHLIB_SUFFIX"))'

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    # Setup Python virtual-environment for cijoe and Python xNVMe bindings to run ramdisk testing
    - name: CIJOE, setup pipx environment
      run: |
        make cijoe-install

    - name: CIJOE, check that it is available
      run: |
        cijoe -r

    - name: Python-bindings (ctypes), install and test
      run: |
        pipx inject xnvme-cijoe "${{ steps.source.outputs.directory }}/xnvme-py-sdist.tar.gz" --force
        pytest --pyargs xnvme.ctypes_bindings

    #
    # Ramdisk testing
    #
    - name: Install fio
      run: |
        git clone https://github.com/axboe/fio.git /tmp/fio
        cd /tmp/fio
        git checkout fio-3.38
        git rev-parse --short HEAD
        gmake

    - name: CIJOE, run test-ramdisk.yaml
      run: |
        cd cijoe && cijoe "tasks/test-ramdisk-macos.yaml" \
        --monitor \
        --config "configs/ramdisk-macos.toml" \
        --config "configs/xnvme.toml" \
        --output "${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-test-ramdisk"

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive build-${{ matrix.os }}-${{ matrix.ver }}-reports
      if: always()
      run: |
        tar czf ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-*

    - name: CIJOE, upload build-${{ matrix.os }}-${{ matrix.ver }}-reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports
        path: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports.tar.gz
        if-no-files-found: error

  #
  # Build on Windows
  #
  build-windows:
    needs: [source-archive, source-format-check, build-python, changes-to-docs]
    runs-on: ${{ matrix.os }}-${{ matrix.ver }}
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: 'windows', ver: '2025'}

    steps:
    - name: Setup paths
      shell: cmd
      run: |
        echo %ALLUSERSPROFILE%\chocolatey\bin>> %GITHUB_PATH%
        echo %SystemDrive%\tools\msys64\mingw64\bin>> %GITHUB_PATH%
        echo %SystemDrive%\tools\msys64>> %GITHUB_PATH%
        echo %SystemDrive%\tools\msys64\usr\lib>> %GITHUB_PATH%
        echo %SystemDrive%\tools\msys64\usr\bin>> %GITHUB_PATH%
        echo PKG_CONFIG_PATH=%SystemDrive%/tools/msys64/usr/lib/pkgconfig;%SystemDrive%\tools\msys64\usr\lib\pkgconfig >> %GITHUB_ENV%

    - name: Show paths
      shell: powershell
      run: |
        echo $env:Path

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Install build-requirements
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        .\toolbox\pkgs\windows-2022.ps1

    - name: Configure and build with debug enabled
      shell: bash
      run: |
        meson setup builddir --buildtype=debug
        meson compile -C builddir
        make clean # prepare for building without debug

    - name: Build!
      shell: powershell
      run: |
        meson setup builddir --prefix "$env:SystemDrive\tools\msys64\usr" --default-library=static
        meson compile -C builddir

    - name: meson-log-dump
      shell: bash
      if: always()
      run: |
        cat builddir/meson-logs/meson-log.txt || true

    - name: Dump the compile-commands and machine
      shell: bash
      run: |
        cat /proc/cpuinfo || true
        cat builddir/compile_commands.json || true

    - name: Install
      run: |
        meson install -C builddir

    - name: Execute xnvme commands
      shell: powershell
      run: |
        xnvme.exe library-info
        xnvme.exe enum

    - name: Check pkg-config
      shell: bash
      run: |
        pkg-config xnvme --libs
        pkg-config xnvme --variable=datadir
        pkg-config xnvme --variable=includedir
        pkg-config xnvme --variable=libdir
        pkg-config xnvme --variable=pcfiledir
        pkg-config xnvme --variable=prefix
        ls -lh $(pkg-config xnvme --variable=libdir) | grep xnvme

    - name: Check Python, pip, platform, and sysconfig
      shell: bash
      run: |
        python3 --version
        python3 -m pip --version
        python3 -c "import platform; print(platform.system()); print(platform.uname())"
        python3 -c 'import sysconfig; print(sysconfig.get_config_var("SHLIB_SUFFIX"))'

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    # Setup Python virtual-environment for cijoe and Python xNVMe bindings to run ramdisk testing
    - name: CIJOE, setup pipx environment
      run: |
        make cijoe-install

    - name: CIJOE, check that it is available
      run: |
        cijoe -r

    #
    # Ramdisk testing
    #
    - name: Install fio
      shell: bash
      run: |
        rm -rf C:/tmp/fio
        git clone https://github.com/axboe/fio.git C:/tmp/fio
        cd C:/tmp/fio
        git checkout fio-3.41
        git rev-parse --short HEAD
        make clean
        make CFLAGS="-O0"

    - name: CIJOE, run test-ramdisk-windows.yaml
      shell: bash
      run: |
        cd cijoe; cijoe "tasks/test-ramdisk-windows.yaml" \
        --monitor \
        --config "configs/ramdisk-windows.toml" \
        --output "${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-test-ramdisk"

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive build-${{ matrix.os }}-${{ matrix.ver }}-reports
      if: always()
      run: |
        tar czf ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-*

    - name: CIJOE, upload build-${{ matrix.os }}-${{ matrix.ver }}-reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports
        path: ${{ github.job }}-${{ matrix.os }}-${{ matrix.ver }}-reports.tar.gz
        if-no-files-found: error

  #
  # Build and test xNVMe
  #
  generate-verify-matrix:
    needs: [source-archive, source-format-check, build-python, changes-to-docs]
    runs-on: ubuntu-24.04
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'verify'))

    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}

    env:
      # Each entry is expanded into one entry per 'test_*' step of the cijoe task it
      # runs, so that the test-steps of a task are verified as separate jobs.
      BASE_MATRIX: |
        - {os: 'freebsd', ver: '14', guest_dir: 'freebsd-14-amd64', transport: 'pcie'}
        #- {os: 'freebsd', ver: '15', guest_dir: 'freebsd-15-amd64', transport: 'pcie'}
        - {os: 'debian', ver: 'trixie-iommu_enabled', guest_dir: 'debian-trixie-amd64', transport: 'pcie'}
        - {os: 'debian', ver: 'trixie-iommu_disabled', guest_dir: 'debian-trixie-amd64', transport: 'pcie'}
        - {os: 'debian', ver: 'trixie-iommu_enabled', guest_dir: 'debian-trixie-amd64', transport: 'tcp-spdk'}
        - {os: 'debian', ver: 'trixie-iommu_enabled', guest_dir: 'debian-trixie-amd64', transport: 'tcp-linux'}

    steps:
    - uses: actions/checkout@v6

    - name: Generate the job-matrix from the cijoe tasks
      id: generate
      run: |
        pip install --quiet pyyaml
        python3 toolbox/gha_matrix.py <<< "$BASE_MATRIX" >> "$GITHUB_OUTPUT"

    - name: Show the generated job-matrix
      run: |
        echo '${{ steps.generate.outputs.matrix }}' | python3 -m json.tool

  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.ver }}, ${{ matrix.transport }}, ${{ matrix.test }})
    needs: [generate-verify-matrix, source-archive, source-format-check, build-python]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.job == 'verify')

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-verify-matrix.outputs.matrix) }}

    container:
      image: ghcr.io/xnvme/xnvme-devenv/host:v0.12.0
      # /mnt is the runner's ~70 GiB ephemeral disk; the nosi qcow2 + raw
      # decompression overflow the container's small overlay otherwise.
      options: --privileged -v /mnt:/mnt

    steps:
    - uses: xnvme/actions/.github/actions/cleanup@main

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    - name: Prep, environment GITHUB_PATH
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        cp -r ${{ steps.source.outputs.directory }} /tmp/artifacts
        find /tmp/artifacts

    - name: CIJOE, setup pipx environment
      run: |
        make guest-env <<< "${{ matrix.os }}-${{ matrix.ver }}"

    - name: CIJOE, check that it is available
      run: |
        cijoe -r

    # Land the nosi qcow2 and the emulated-NVMe raw backing images on /mnt
    # instead of / (which is cramped): the guest and its per-controller 8 GiB
    # raw images live under $HOME/guests and otherwise fill the root disk
    # mid-test, dropping device writes.
    - name: Stage artifacts on /mnt
      if: matrix.os == 'debian' || matrix.os == 'freebsd'
      run: |
        mkdir -p /mnt/system_imaging
        ln -s /mnt/system_imaging "$HOME/system_imaging"
        mkdir -p /mnt/guests
        ln -s /mnt/guests "$HOME/guests"

    - name: CIJOE, provision and test guest
      run: |
        make verify-guest \
          TRANSPORT="${{ matrix.transport }}" \
          TEST_STEPS="${{ matrix.steps }}" \
          CIJOE_OUTPUT="${{ github.job }}-${{ matrix.id }}"

    - name: Collect guest serial console
      if: always() && (matrix.os == 'debian' || matrix.os == 'freebsd')
      run: |
        dst="cijoe/${{ github.job }}-${{ matrix.id }}"
        serial="$HOME/guests/${{ matrix.guest_dir }}/serial.output"
        echo "::group::guest serial console (tail)"
        tail -c 20000 "$serial" 2>/dev/null || echo "no guest serial output"
        echo "::endgroup::"
        cp "$serial" "${dst}-serial.output" 2>/dev/null || true

    - name: Collect vfu_kvssd device log
      if: always()
      run: |
        dst="cijoe/${{ github.job }}-${{ matrix.id }}"
        echo "::group::vfu_kvssd device log"
        cat $HOME/run/vfu_kvssd.log 2>/dev/null || echo "no vfu_kvssd device log"
        echo "::endgroup::"
        cp $HOME/run/vfu_kvssd.log "${dst}-vfu_kvssd.log" 2>/dev/null || true

    - name: CIJOE, result-log-dump on error
      if: failure()
      run: |
        find cijoe -name "*.output" | while read -r fpath; do
          echo "=== ${fpath}"
          cat "${fpath}"
        done

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.id }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.id }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive verify-${{ matrix.id }}-reports
      if: always()
      run: |
        tar czf ${{ github.job }}-${{ matrix.id }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.id }}-*

    - name: CIJOE, upload verify-${{ matrix.id }}-reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.id }}-reports
        path: ${{ github.job }}-${{ matrix.id }}-reports.tar.gz
        if-no-files-found: error

  #
  # Build and test xNVMe on physical machines
  #
  verify-physical:
    needs: [source-archive, source-format-check, build-python, changes-to-docs]
    runs-on: ${{ matrix.labels }}
    if: needs.changes-to-docs.outputs.docs_prose_only != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'maas')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.job
      == 'verify'))

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: 'macos', ver: 'sonoma', hostname: 'verify-phys-macos', labels: [self-hosted, macos, verify]}

    container:
      image: debian:trixie
      options: --privileged

    steps:
    - uses: xnvme/actions/.github/actions/cleanup@main

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    - name: Prep, environment GITHUB_PATH
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        cp -r ${{ steps.source.outputs.directory }} /tmp/artifacts
        find /tmp/artifacts

    - name: Packages
      run: |
        apt-get -qy update
        apt-get -qy upgrade
        apt-get -qy install python3 python3-dev python3-venv pipx git make gcc fontconfig
        pipx ensurepath

    - name: CIJOE, setup pipx environment
      run: |
        make cijoe-install
        cijoe --version

    # cd'ing into 'cijoe' to auto-collect the non-packaged github-specific configs and
    # workflows.
    - name: CIJOE, run macvfn-provision.yaml
      if: matrix.os == 'macos'
      run: |
        cd cijoe && cijoe "tasks/macvfn-provision.yaml" \
        --monitor \
        --config "configs/${{ matrix.hostname }}.toml" \
        --output "${{ github.job }}-${{ matrix.hostname }}-provision-macvfn"

    - name: CIJOE, run provisioning
      run: |
        cd cijoe && cijoe "tasks/provision-using-tgz.yaml" \
        --monitor \
        --config "configs/${{ matrix.hostname }}.toml" \
        --output "${{ github.job }}-${{ matrix.hostname }}-provision-xnvme" \
        xnvme_source_sync xnvme_build_prep test_deps xnvme_build xnvme_install \
        ldconfig xnvme_bindings_py_install_tgz fio_prep

    - name: CIJOE, run tests
      run: |
        cd cijoe && cijoe "tasks/test-${{ matrix.os }}-${{ matrix.ver }}.yaml" \
        --monitor \
        --config "configs/${{ matrix.hostname }}.toml" \
        --output "${{ github.job }}-${{ matrix.hostname }}-test-results"

    - name: CIJOE, result-log-dump on error
      if: failure()
      run: |
        find cijoe -name "*.output" | while read -r fpath; do
          echo "=== ${fpath}"
          cat "${fpath}"
        done

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.hostname }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.hostname }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive verify-${{ matrix.hostname }}-reports
      if: always()
      run: |
        tar czf ${{ github.job }}-${{ matrix.hostname }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.hostname }}-*

    - name: CIJOE, upload verify-${{ matrix.hostname }}-reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.hostname }}-reports
        path: ${{ github.job }}-${{ matrix.hostname }}-reports.tar.gz
        if-no-files-found: error

  #
