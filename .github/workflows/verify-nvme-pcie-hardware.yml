---
name: verify-nvme-pcie-hardware

# Verify xNVMe on the lab machines, called by 'verify' for a pull-request
# labelled 'maas', and by a manual run.
on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  #
  # Build and test xNVMe on physical machines
  #
  physical:
    runs-on: ${{ matrix.labels }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: 'macos', ver: 'sonoma', hostname: 'verify-phys-macos', labels: [self-hosted, macos, verify]}

    container:
      image: debian:trixie
      options: --privileged

    steps:
    - uses: xnvme/actions/.github/actions/cleanup@main

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    - name: Prep, environment GITHUB_PATH
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        cp -r ${{ steps.source.outputs.directory }} /tmp/artifacts
        find /tmp/artifacts

    - name: Packages
      run: |
        apt-get -qy update
        apt-get -qy upgrade
        apt-get -qy install python3 python3-dev python3-venv pipx git make gcc fontconfig
        pipx ensurepath

    - name: CIJOE, setup pipx environment
      run: |
        make cijoe-install
        cijoe --version

    # cd'ing into 'cijoe' to auto-collect the non-packaged github-specific configs and
    # workflows.
    - name: CIJOE, run macvfn-provision.yaml
      if: matrix.os == 'macos'
      run: |
        cd cijoe && cijoe "tasks/macvfn-provision.yaml" \
        --monitor \
        --config "configs/${{ matrix.hostname }}.toml" \
        --output "${{ github.job }}-${{ matrix.hostname }}-provision-macvfn"

    - name: CIJOE, run provisioning
      run: |
        cd cijoe && cijoe "tasks/provision-using-tgz.yaml" \
        --monitor \
        --config "configs/${{ matrix.hostname }}.toml" \
        --output "${{ github.job }}-${{ matrix.hostname }}-provision-xnvme" \
        xnvme_source_sync xnvme_build_prep test_deps xnvme_build xnvme_install \
        ldconfig xnvme_bindings_py_install_tgz fio_prep

    - name: CIJOE, run tests
      run: |
        cd cijoe && cijoe "tasks/test-${{ matrix.os }}-${{ matrix.ver }}.yaml" \
        --monitor \
        --config "configs/${{ matrix.hostname }}.toml" \
        --output "${{ github.job }}-${{ matrix.hostname }}-test-results"

    - name: CIJOE, result-log-dump on error
      if: failure()
      run: |
        find cijoe -name "*.output" | while read -r fpath; do
          echo "=== ${fpath}"
          cat "${fpath}"
        done

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.hostname }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.hostname }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive verify-${{ matrix.hostname }}-reports
      if: always()
      run: |
        tar czf ${{ github.job }}-${{ matrix.hostname }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.hostname }}-*

    - name: CIJOE, upload verify-${{ matrix.hostname }}-reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.hostname }}-reports
        path: ${{ github.job }}-${{ matrix.hostname }}-reports.tar.gz
        if-no-files-found: error

  #
  # Build and test xNVMe on physical hardware on MaaS
  #
  passthru:
    runs-on: ${{ matrix.labels }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: 'debian', ver: 'trixie-iommu_enabled', transport: 'pcie', hostname: 'ax42-linux', labels: [self-hosted, linux,
            amd64, maas]}

    container:
      image: ghcr.io/xnvme/xnvme-devenv/host:v0.14.0
      options: --privileged --pid=host --ulimit memlock=-1 -v /home/ghr/system_imaging:/github/home/system_imaging

    steps:
    - uses: xnvme/actions/.github/actions/cleanup@main

    - name: Retrieve and unpack the xNVMe source archive
      uses: xnvme/actions/.github/actions/setup-source@main
      id: source
      with:
        name: xnvme-src-archive-with-subprojects

    - name: Retrieve the xNVMe Python sdist package
      uses: actions/download-artifact@v7.0.0
      with:
        name: xnvme-py-sdist
        path: ${{ steps.source.outputs.directory }}

    - name: Prep, environment GITHUB_PATH
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        cp -r ${{ steps.source.outputs.directory }} /tmp/artifacts
        find /tmp/artifacts

    - name: CIJOE, setup pipx environment
      run: |
        make guest-env <<< "${{ matrix.os }}-${{ matrix.ver }}"

    - name: CIJOE, check that it is available
      run: |
        cijoe -r

    - name: CIJOE, provision and test guest
      run: |
        make verify-guest \
          TRANSPORT="${{ matrix.transport }}" \
          PASSTHRU=0000:02:00.0 \
          CIJOE_OUTPUT="${{ github.job }}-${{ matrix.hostname }}"

    - name: Collect guest serial console
      if: always()
      run: |
        serial="$HOME/guests/debian-trixie-amd64/serial.output"
        echo "::group::guest serial console (tail)"
        tail -c 20000 "$serial" 2>/dev/null || echo "no guest serial output"
        echo "::endgroup::"
        cp "$serial" "cijoe/${{ github.job }}-${{ matrix.hostname }}-serial.output" 2>/dev/null || true

    - name: CIJOE, result-log-dump on error
      if: failure()
      run: |
        find cijoe -name "*.output" | while read -r fpath; do
          echo "=== ${fpath}"
          cat "${fpath}"
        done

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ github.job }}-${{ matrix.hostname }}-report-html
        path: cijoe/${{ github.job }}-${{ matrix.hostname }}-*/report.html
        if-no-files-found: warn

    - name: CIJOE, archive verify-${{ matrix.hostname }}-reports
      if: always()
      run: |
        tar czf ${{ github.job }}-${{ matrix.hostname }}-reports.tar.gz \
          cijoe/${{ github.job }}-${{ matrix.hostname }}-*

    - name: CIJOE, upload verify-${{ matrix.hostname }}-reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: ${{ github.job }}-${{ matrix.hostname }}-reports
        path: ${{ github.job }}-${{ matrix.hostname }}-reports.tar.gz
        if-no-files-found: error
