---
# The labels a pull-request's changed files call for, as the 'labeler' workflow
# adds them when it leaves draft, and as the 'gates' job of 'verify' reads them
# on the run that starts then. A rule only adds a label; one set by hand stays.
# Globs take '*', '**' as a whole path segment, and '?'; toolbox/gha_gates.py
# rejects anything else, as it would read it otherwise than the labeler does.
'gate:emulated':
- changed-files:
  - any-glob-to-any-file:
    - 'lib/**'
    - 'include/**'
    - 'tools/**'
    - 'tests/**'
    - 'examples/**'
    - 'cijoe/**'
    - 'subprojects/**'
    - 'toolbox/pkgs/**'
    - 'toolbox/*.py'
    - 'python/**'
    - '.github/workflows/**'
    - 'meson.build'
    - 'meson_options.txt'
    - 'Makefile'

'gate:hardware':
- changed-files:
  - any-glob-to-any-file:
    - 'lib/backend/upcie/**'
    - 'lib/backend/linux/**'
    - 'lib/backend/libaio/**'
    - 'lib/backend/liburing/**'
    - 'include/**'

'gate:gpu':
- changed-files:
  - any-glob-to-any-file:
    - 'lib/backend/upcie/*cuda*'
    - 'lib/backend/upcie/*hip*'
    - 'lib/backend/liburing/*dmabuf*'
    - '**/*cuda*'
    - '**/*hip*'

'gate:rdma':
- changed-files:
  - any-glob-to-any-file:
    - 'lib/backend/spdk/**'
    - '**/*rdma*'
    - '**/*fabrics*'

'gate:perf':
- changed-files:
  - any-glob-to-any-file:
    - 'tools/xnvmeperf/**'
    - 'lib/backend/upcie/**'
    - 'lib/core/xnvme_queue*'

'gate:docgen':
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**'
    - 'tools/**'
    - 'include/**'
    - '*.md'
